{id:28,name:"Daisy",brand:"Marc Jacobs",accords:{floral:100,fresh:70,fruity:70,green:40},notes:{top:["Morango","Violeta"],mid:["Gardênia","Jasmim"],base:["Almíscar","Baunilha"]}},
{id:29,name:"N°5",brand:"Chanel",accords:{floral:100,powdery:70,aldehyde:70,woody:40},notes:{top:["Aldeídos","Neroli"],mid:["Rosa","Jasmim"],base:["Sândalo","Baunilha"]}},
{id:30,name:"Bombshell",brand:"Victoria's Secret",accords:{fruity:100,floral:70,fresh:70,citrus:40},notes:{top:["Maracujá","Tangerina"],mid:["Peônia","Orquídea"],base:["Almíscar","Madeira"]}},

const BASES=DB.slice(0,20).map((p,i)=>{
const P=[
{n:"Fresco Luminoso",d:"Cítrico • Fresco • Leve • Vibrante",t:"Fragrâncias leves e vibrantes que trazem sensação de frescor e energia."},
{n:"Chipre Moderno",d:"Cítrico • Especiado • Amadeirado",t:"Equilíbrio perfeito entre frescor cítrico e profundidade amadeirada."},
{n:"Floral Clássico",d:"Floral • Elegante • Atemporal",t:"Florais elegantes com presença suave e sofisticada."},
{n:"Floral Radiante",d:"Floral • Frutado • Luminoso",t:"Florais e frutados que iluminam sua presença."},

{n:"Doce Irresistível",d:"Doce • Gourmand • Envolvente",t:"Aromas doces e aconchegantes que envolvem e seduzem."},

{n:"Ambarado Único",d:"Âmbar • Exclusivo • Memorável",t:"Fragrâncias ambaradas absolutamente memoráveis."},
{n:"Doce Sensual",d:"Doce • Cremoso • Envolvente",t:"Cremosidade e sensualidade que acolhem e seduzem."},

{n:"Baunilha Pura",d:"Baunilha • Suave • Reconfortante",t:"Pureza da baunilha que acalma e encanta."},

];
return{id:p.id,code:`SHI Nº ${String(i+1).padStart(2,'0')}`,name:P[i].n,desc:P[i].d,detail:P[i].t,accords:p.accords};
});

function cosineSim(a,b){const ks=new Set([...Object.keys(a),...Object.keys(b)]);let d=0,ma=0,mb=0;ks.forEach(k=>{const va=a[k]||0,vb=b[k]||0;d+=va*vb;ma+=va*va;mb+=vb*vb});return(ma&&mb)?d/Math.sqrt(ma*mb):0}
function recommend(sel){if(!sel.length)return[];const p={};sel.forEach(s=>{Object.entries(s.accords||{}).forEach(([k,v])=>{p[k]=(p[k]||0)+v})});const n=sel.length;Object.keys(p).forEach(k=>p[k]/=n);return BASES.map(b=>({...b,score:cosineSim(p,b.accords)})).sort((a,b)=>b.score-a.score).slice(0,3)}

function App(){
const[screen,setScreen]=useState("welcome");
const[fade,setFade]=useState(true);
const[evtPass,setEvtPass]=useState("");
const[evtErr,setEvtErr]=useState(false);
const[formName,setFormName]=useState("");
const[formEmail,setFormEmail]=useState("");
const[formWA,setFormWA]=useState("");
const[formMkt,setFormMkt]=useState(false);
const[slots,setSlots]=useState([null,null,null]);
const[activeSlot,setActiveSlot]=useState(-1);
const[searchVal,setSearchVal]=useState("");
const[step,setStep]=useState(0);
const[results,setResults]=useState([]);
const scrollRef=useRef(null);
const searchInputRef=useRef(null);

const go=useCallback(s=>{setFade(false);setTimeout(()=>{setScreen(s);setFade(true);if(scrollRef.current)scrollRef.current.scrollTop=0},250)},[]);
const isMob=typeof window!=='undefined'&&window.innerWidth<=500;

useEffect(()=>{if(screen==="analyzing"){setStep(0);const ts=[800,1600,2400].map((ms,i)=>setTimeout(()=>setStep(i+1),ms));const f=setTimeout(()=>{setResults(recommend(slots.filter(Boolean)));go("result")},3400);return()=>{ts.forEach(clearTimeout);clearTimeout(f)}}},[screen]);
useEffect(()=>{if(activeSlot>=0&&searchInputRef.current)searchInputRef.current.focus()},[activeSlot]);

const filtered=searchVal.length>=2?DB.filter(p=>(p.name.toLowerCase().includes(searchVal.toLowerCase())||p.brand.toLowerCase().includes(searchVal.toLowerCase()))&&!slots.find(s=>s&&s.id===p.id)).slice(0,6):[];
const selectPerfume=p=>{const ns=[...slots];ns[activeSlot]=p;setSlots(ns);setActiveSlot(-1);setSearchVal("")};
const removeSlot=i=>{const ns=[...slots];ns[i]=null;setSlots(ns)};
const filledCount=slots.filter(Boolean).length;
const handlePass=()=>{if(evtPass.toUpperCase()==="ANA2508"){setEvtErr(false);go("register")}else setEvtErr(true)};
const reset=()=>{setSlots([null,null,null]);setSearchVal("");setEvtPass("");setFormName("");setFormEmail("");setFormWA("");setFormMkt(false);setResults([]);go("welcome")};

const C={bg:"#FAFAF8",white:"#FFF",alt:"#F4F1ED",border:"#E5E0DA",black:"#1A1A1A",g1:"#555",g2:"#888",g3:"#AAA",g4:"#CCC",g5:"#E8E4DF"};
const serif="'Cormorant Garamond',serif";
const btnP={width:"100%",padding:"16px",border:"none",borderRadius:0,background:C.black,color:C.white,fontSize:11,fontWeight:600,letterSpacing:"2.5px",textTransform:"uppercase",transition:"all .2s"};
const btnS={...btnP,background:"transparent",color:C.g2,border:`1px solid ${C.border}`};
const inp={width:"100%",padding:"13px 0",background:"transparent",border:"none",borderBottom:`1px solid ${C.border}`,color:C.black,fontSize:16,borderRadius:0,boxSizing:"border-box"};
const lbl={fontSize:10,color:C.g2,letterSpacing:"2px",textTransform:"uppercase",marginBottom:4,display:"block"};
const frame=isMob?{width:"100%",height:"100%",minHeight:"100vh",background:C.bg,display:"flex",flexDirection:"column"}:{width:"100%",maxWidth:400,height:780,background:C.bg,borderRadius:44,border:`1px solid ${C.border}`,boxShadow:"0 20px 80px rgba(0,0,0,0.08)",display:"flex",flexDirection:"column",overflow:"hidden"};

const Dots=({c:cur,t})=><div style={{display:"flex",gap:8,justifyContent:"center",padding:"16px 0 12px"}}>{Array.from({length:t}).map((_,i)=><div key={i} style={{width:i===cur?20:5,height:5,borderRadius:3,background:i===cur?C.black:C.g5,transition:"all .3s"}}/>)}</div>;
const Divider=()=><div style={{width:36,height:.5,background:C.g4,margin:"0 auto"}}/>;

return(
<div style={{minHeight:"100vh",background:isMob?C.bg:"#F0EDE8",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:isMob?"flex-start":"center",padding:isMob?0:20}}>
{!isMob&&<div style={{display:"flex",gap:5,marginBottom:14,flexWrap:"wrap",justifyContent:"center"}}>{[["welcome","Entrada"],["register","Cadastro"],["search","Perfumes"],["analyzing","Análise"],["result","Resultado"],["passport","Passaporte"]].map(([k,l])=><button key={k} onClick={()=>{if(k==="result"||k==="passport"){if(!results.length){const s=[DB[0],DB[3],DB[7]];setSlots(s);setResults(recommend(s));setFormName("Iza Garcia")}}if(k==="analyzing"){if(!slots.filter(Boolean).length)setSlots([DB[0],DB[3],DB[7]]);setScreen("analyzing");setStep(0);setFade(true);return}setScreen(k);setFade(true)}} style={{padding:"5px 11px",border:`1px solid ${screen===k?C.black:C.border}`,background:screen===k?C.black:"transparent",color:screen===k?"#fff":C.g2,fontSize:9,fontWeight:500,letterSpacing:1,borderRadius:0}}>{l}</button>)}</div>}

<div style={frame}>
{!isMob&&<div style={{height:44,flexShrink:0}}/>}
<div ref={scrollRef} style={{flex:1,overflowY:"auto",overflowX:"hidden",display:"flex",flexDirection:"column"}}>
<div style={{padding:isMob?"0 24px":"0 28px",opacity:fade?1:0,transition:"opacity .25s ease",flex:1,display:"flex",flexDirection:"column"}}>

{screen==="welcome"&&(
<div style={{flex:1,display:"flex",flexDirection:"column",justifyContent:"center",alignItems:"center",textAlign:"center",padding:"16px 8px"}}>
<div style={{fontSize:10,letterSpacing:4,color:C.g3,textTransform:"uppercase",marginBottom:8}}>Experiência Olfativa</div>

<Divider/>
<div style={{margin:"24px 0"}}><Logo size="lg"/></div>
<div style={{fontSize:13,color:C.g2,lineHeight:1.8,maxWidth:240,marginBottom:28,fontWeight:300}}>Descubra qual fragrância<br/>combina com você</div>
<div style={{width:"100%",maxWidth:260,marginBottom:16}}>

{screen==="register"&&(

<div style={{display:"flex",flexDirection:"column",gap:18,flex:1}}>

<div style={{fontSize:10,color:C.g3,lineHeight:1.7,marginTop:16}}>Seus dados registram sua experiência e perfil olfativo.</div>
<div onClick={()=>setFormMkt(!formMkt)} style={{display:"flex",gap:10,alignItems:"flex-start",cursor:"pointer",padding:"12px 0"}}>
<div style={{width:16,height:16,flexShrink:0,marginTop:1,border:formMkt?`1.5px solid ${C.black}`:`1.5px solid ${C.g4}`,background:formMkt?C.black:"transparent",display:"flex",alignItems:"center",justifyContent:"center",transition:"all .2s"}}>{formMkt&&<span style={{color:"#fff",fontSize:10,fontWeight:700}}>✓</span>}</div>
<div style={{fontSize:11,color:C.g2,lineHeight:1.5}}>Quero receber novidades e experiências da SHI.</div></div>
<button onClick={()=>go("search")} style={{...btnP,marginTop:4}}>Começar experiência</button>
</div>

{screen==="search"&&(
<div style={{flex:1,display:"flex",flexDirection:"column",padding:"0 0 24px"}}>
<Dots c={1} t={4}/>
<div style={{textAlign:"center",marginBottom:16}}>

<div style={{display:"flex",gap:10,marginBottom:12,justifyContent:"center"}}>
{slots.map((s,i)=>(
<div key={i} onClick={()=>{if(s)removeSlot(i);else{setActiveSlot(i);setSearchVal("")}}} style={{width:100,height:110,border:activeSlot===i?`2px solid ${C.black}`:`1.5px solid ${s?C.border:C.g5}`,background:s?C.white:C.alt,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",cursor:"pointer",position:"relative",padding:6,transition:"all .2s"}}>
{s?(<>

<div style={{fontSize:10,color:C.black,fontWeight:500,textAlign:"center",lineHeight:1.3}}>{s.name}</div>
<div style={{fontSize:8,color:C.g2,textAlign:"center",marginTop:2}}>{s.brand}</div>
</>):(<>
<div style={{width:24,height:24,border:`1.5px solid ${C.g4}`,borderRadius:12,display:"flex",alignItems:"center",justifyContent:"center",marginBottom:4}}><span style={{color:C.g3,fontSize:14,lineHeight:1}}>+</span></div>
<div style={{fontSize:9,color:C.g3,letterSpacing:1}}>Perfume {i+1}</div>
</>)}
</div>))}
</div>

<div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12,justifyContent:"center"}}>
<div style={{display:"flex",gap:3}}>{[0,1,2].map(i=><div key={i} style={{width:24,height:3,borderRadius:2,background:i<filledCount?C.black:C.g5,transition:"all .3s"}}/>)}</div>
<span style={{fontSize:10,color:filledCount>=3?C.black:C.g2,fontWeight:filledCount>=3?600:400}}>
{filledCount===0?"Selecione":filledCount===1?"Bom começo!":filledCount===2?"Quase lá!":"Precisão máxima"}</span></div>

{activeSlot>=0&&(
<div style={{animation:"fadeUp .25s ease",flex:1}}>
<input ref={searchInputRef} type="text" autoComplete="off" autoCorrect="off" autoCapitalize="off" spellCheck={false} enterKeyHint="search" placeholder="Buscar perfume ou marca..." value={searchVal} onChange={e=>setSearchVal(e.target.value)} style={{...inp,borderBottom:`1.5px solid ${C.black}`,fontSize:14,padding:"12px 0"}}/>
{searchVal.length>=2&&filtered.length===0&&<div style={{textAlign:"center",padding:16,color:C.g3,fontSize:12}}>Nenhum resultado para "{searchVal}"</div>}
<div style={{maxHeight:280,overflowY:"auto"}}>
{filtered.map(p=>(
<div key={p.id} onClick={()=>selectPerfume(p)} style={{display:"flex",alignItems:"center",gap:12,padding:"11px 0",borderBottom:`0.5px solid ${C.g5}`,cursor:"pointer"}}>
<div style={{width:38,height:38,background:C.alt,border:`1px solid ${C.g5}`,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
<span style={{fontFamily:serif,fontSize:15,color:C.g3}}>{p.name[0]}</span></div>
<div><div style={{fontSize:13,color:C.black}}>{p.name}</div><div style={{fontSize:10,color:C.g2,fontWeight:300}}>{p.brand}</div></div>
</div>))}
</div>
{searchVal.length<2&&<div style={{textAlign:"center",fontSize:10,color:C.g4,marginTop:10}}>Digite para buscar</div>}
</div>)}

{filledCount>0&&activeSlot<0&&(
<div style={{borderTop:`0.5px solid ${C.border}`,paddingTop:12,marginBottom:12}}>
<div style={{fontSize:10,letterSpacing:2,color:C.g2,textTransform:"uppercase",marginBottom:8}}>Notas dos seus perfumes</div>
{["top","mid","base"].map(tier=>{
const names={top:"Topo 🌿",mid:"Coração ❤️",base:"Base 🪵"};
const allN=[...new Set(slots.filter(Boolean).flatMap(s=>(s.notes&&s.notes[tier])||[]))];
if(!allN.length)return null;
return<div key={tier} style={{marginBottom:6}}>
<div style={{fontSize:9,color:C.g3,letterSpacing:1.5,textTransform:"uppercase",marginBottom:4}}>{names[tier]}</div>
<div style={{display:"flex",gap:4,flexWrap:"wrap"}}>{allN.map((n,i)=><span key={i} style={{fontSize:10,color:C.g1,background:C.alt,border:`0.5px solid ${C.g5}`,padding:"3px 8px",borderRadius:12,fontWeight:300}}>{n}</span>)}</div>
</div>})}
</div>)}

{filledCount>=1&&activeSlot<0&&<div style={{marginTop:"auto"}}>
<button onClick={()=>go("analyzing")} style={btnP}>Descobrir meu perfil</button>
{filledCount<3&&<div style={{textAlign:"center",fontSize:10,color:C.g3,marginTop:6}}>{filledCount===1?"Adicione mais para maior precisão":"Mais um para precisão máxima!"}</div>}
</div>}
</div>)}

{screen==="analyzing"&&(
<div style={{flex:1,display:"flex",flexDirection:"column",justifyContent:"center",alignItems:"center",textAlign:"center"}}>
<div style={{position:"relative",width:120,height:120,marginBottom:40}}>
{[0,1,2,3].map(i=><div key={i} style={{position:"absolute",inset:i*13,border:`0.5px solid rgba(26,26,26,${.15-i*.03})`,animation:`${i%2===0?"spin":"spinR"} ${6+i*2}s linear infinite`}}/>)}
<div style={{position:"absolute",inset:42,background:"rgba(26,26,26,0.04)",display:"flex",alignItems:"center",justifyContent:"center"}}><span style={{fontFamily:serif,fontSize:18,color:C.black}}>S</span></div></div>
{["Analisando suas escolhas","Identificando acordes","Mapeando perfil olfativo","Encontrando seu SHI"].map((m,i)=><div key={i} style={{fontSize:12,fontWeight:300,color:i<=step?C.g1:C.g5,marginBottom:7,transition:"color .4s"}}>{m}{i===step&&<span style={{animation:"pulse 1s infinite"}}> …</span>}</div>)}
<div style={{display:"flex",gap:3,marginTop:24}}>{[0,1,2,3].map(i=><div key={i} style={{width:22,height:1.5,background:i<=step?C.black:C.g5,transition:"background .4s"}}/>)}</div>
</div>)}

{screen==="result"&&results.length>0&&(
<div style={{flex:1,display:"flex",flexDirection:"column",padding:"0 0 24px"}}>
<Dots c={2} t={4}/>
<div style={{animation:"fadeUp .6s ease",flex:1,display:"flex",flexDirection:"column"}}>
<div style={{textAlign:"center",fontSize:10,letterSpacing:3,color:C.g2,textTransform:"uppercase",marginBottom:16}}>Seu perfil olfativo</div>
<div style={{border:`1px solid ${C.border}`,padding:"28px 18px",textAlign:"center",position:"relative",marginBottom:16,background:C.white}}>
<div style={{position:"absolute",top:-8,left:"50%",transform:"translateX(-50%)",background:C.bg,padding:"0 10px",fontSize:9,letterSpacing:3,color:C.g3}}>RESULTADO PRINCIPAL</div>
<div style={{fontFamily:serif,fontSize:26,color:C.black,fontWeight:400,letterSpacing:2,marginBottom:8,lineHeight:1.2}}>{results[0].name}</div>
<div style={{fontSize:11,color:C.g2,letterSpacing:1.5,marginBottom:20,fontWeight:300}}>{results[0].desc}</div>
<Divider/>
<div style={{marginTop:20}}>
<div style={{fontSize:9,letterSpacing:3,color:C.g3,textTransform:"uppercase",marginBottom:4}}>Sua fragrância</div>
<div style={{fontFamily:serif,fontSize:28,color:C.black,fontWeight:400,letterSpacing:2}}>{results[0].code}</div>
<div style={{fontSize:10,color:C.g2,marginTop:4}}>{Math.round(results[0].score*100)}% de afinidade</div>
</div></div>
<div style={{padding:"12px 0",borderTop:`.5px solid ${C.g5}`,borderBottom:`.5px solid ${C.g5}`,marginBottom:16}}>
<div style={{fontSize:13,color:C.g1,lineHeight:1.8,fontWeight:300}}>{results[0].detail}</div></div>
{results.length>1&&<div style={{marginBottom:16}}>
<div style={{fontSize:10,letterSpacing:2,color:C.g3,textTransform:"uppercase",marginBottom:8}}>Também combina com você</div>
{results.slice(1).map((r,i)=><div key={i} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 12px",border:`.5px solid ${C.g5}`,background:C.white,marginBottom:4}}>
<div><div style={{fontSize:12,fontWeight:500}}>{r.code}</div><div style={{fontSize:11,color:C.g2,fontWeight:300,marginTop:1}}>{r.name}</div></div>
<div style={{fontSize:11,color:C.g3}}>{Math.round(r.score*100)}%</div></div>)}</div>}
<div style={{marginTop:"auto"}}>
<button onClick={()=>go("passport")} style={btnP}>Passaporte Olfativo</button>
<button onClick={reset} style={{...btnS,marginTop:8}}>Início</button>
</div></div></div>)}

{screen==="passport"&&results.length>0&&(
<div style={{flex:1,display:"flex",flexDirection:"column",justifyContent:"center",padding:"0 0 24px"}}>
<Dots c={3} t={4}/>
<div style={{textAlign:"center",animation:"scaleIn .5s ease",flex:1,display:"flex",flexDirection:"column",justifyContent:"center"}}>
<div style={{border:`1px solid ${C.border}`,padding:"32px 18px 24px",position:"relative",background:C.white}}>
{[{top:0,left:0},{top:0,right:0},{bottom:0,left:0},{bottom:0,right:0}].map((pos,i)=><div key={i} style={{position:"absolute",...pos,width:14,height:14,borderTop:pos.top===0?`1.5px solid ${C.g3}`:"none",borderBottom:pos.bottom===0?`1.5px solid ${C.g3}`:"none",borderLeft:pos.left===0?`1.5px solid ${C.g3}`:"none",borderRight:pos.right===0?`1.5px solid ${C.g3}`:"none"}}/>)}
<div style={{fontSize:9,letterSpacing:4,color:C.g3,textTransform:"uppercase",marginBottom:6}}>Passaporte Olfativo</div>
<Logo/>
<div style={{width:30,height:.5,background:C.g4,margin:"16px auto"}}/>
<div style={{fontSize:11,letterSpacing:2,color:C.g2,textTransform:"uppercase",marginBottom:12}}>{formName||"Convidada"}</div>
<div style={{fontFamily:serif,fontSize:22,color:C.black,fontWeight:400,letterSpacing:1,marginBottom:4}}>{results[0].name}</div>
<div style={{fontSize:11,color:C.g2,letterSpacing:1,fontWeight:300,marginBottom:20}}>{results[0].desc}</div>
<div style={{display:"inline-block",border:`1px solid ${C.border}`,padding:"12px 24px"}}>
<div style={{fontSize:9,letterSpacing:3,color:C.g3,textTransform:"uppercase",marginBottom:4}}>Sua fragrância</div>
<div style={{fontFamily:serif,fontSize:20,color:C.black,fontWeight:400,letterSpacing:2}}>{results[0].code}</div></div>
<div style={{marginTop:16,fontSize:9,color:C.g4}}>Casamento Ana & Lucas • 25/08/2026</div>
</div>
<div style={{marginTop:16,display:"flex",gap:8}}>
<button style={{...btnS,flex:1,fontSize:10,letterSpacing:1.5}}>Compartilhar</button>
<button onClick={reset} style={{...btnS,flex:1,fontSize:10,letterSpacing:1.5}}>Início</button>
</div></div></div>)}

</div></div></div>
{!isMob&&<div style={{color:C.g4,fontSize:9,marginTop:12,textAlign:"center",letterSpacing:1}}>SHI AROMA LAB • Protótipo • Senha: ANA2508</div>}
</div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
