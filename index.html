function cosineSim(a,b){const ks=new Set([...Object.keys(a),...Object.keys(b)]);let d=0,ma=0,mb=0;ks.forEach(k=>{const va=a[k]||0,vb=b[k]||0;d+=va*vb;ma+=va*va;mb+=vb*vb});return(ma&&mb)?d/Math.sqrt(ma*mb):0}
function recommend(sel){if(!sel.length)return[];const p={};sel.forEach(s=>{Object.entries(s.accords||{}).forEach(([k,v])=>{p[k]=(p[k]||0)+v})});const n=sel.length;Object.keys(p).forEach(k=>p[k]/=n);return BASES.map(b=>({...b,score:cosineSim(p,b.accords)})).sort((a,b)=>b.score-a.score).slice(0,3)}

/* ═══ APP ═══ */
function App(){

const filtered=searchVal.length>=2?DB.filter(p=>(p.name.toLowerCase().includes(searchVal.toLowerCase())||p.brand.toLowerCase().includes(searchVal.toLowerCase()))&&!slots.find(s=>s&&s.id===p.id)).slice(0,6):[];
const selectPerfume=(p)=>{const ns=[...slots];ns[activeSlot]=p;setSlots(ns);setActiveSlot(-1);setSearchVal("")};
const removeSlot=(i)=>{const ns=[...slots];ns[i]=null;setSlots(ns)};
const filledCount=slots.filter(Boolean).length;

const C={bg:"#FAFAF8",white:"#FFFFFF",alt:"#F4F1ED",border:"#E5E0DA",bL:"#EDEBE7",black:"#1A1A1A",g1:"#555",g2:"#888",g3:"#AAA",g4:"#CCC",g5:"#E8E4DF"};

const Dots=({c:cur,t})=><div style={{display:"flex",gap:8,justifyContent:"center",padding:isMob?"26px 0 18px":"18px 0 14px"}}>{Array.from({length:t}).map((_,i)=><div key={i} style={{width:i===cur?20:5,height:5,borderRadius:3,background:i===cur?C.black:C.g5,transition:"all .3s"}}/>)}</div>;

const handlePassSubmit=()=>{if(evtPass.toUpperCase()==="ANA2508"){setEvtErr(false);go("register")}else{setEvtErr(true)}};

/* ═══ RENDER ═══ */
return(
<div style={{minHeight:"100vh",background:isMob?C.bg:"#F0EDE8",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:isMob?"flex-start":"center",padding:isMob?0:20}}>
{!isMob&&<div style={{display:"flex",gap:5,marginBottom:14,flexWrap:"wrap",justifyContent:"center"}}>
{[["welcome","Entrada"],["register","Cadastro"],["search","Perfumes"],["analyzing","Análise"],["result","Resultado"],["passport","Passaporte"]].map(([k,l])=><button key={k} onClick={()=>{if(k==="result"||k==="passport"){if(!results.length){const s=[DB[0],DB[3],DB[7]];setSlots(s);setResults(recommend(s))}}if(k==="analyzing"){if(!slots.filter(Boolean).length)setSlots([DB[0],DB[3],DB[7]]);setScreen("analyzing");setStep(0);setFade(true);return}setScreen(k);setFade(true)}} style={{padding:"5px 11px",border:`1px solid ${screen===k?C.black:C.border}`,background:screen===k?C.black:"transparent",color:screen===k?C.white:C.g2,fontSize:9,fontWeight:500,letterSpacing:1,borderRadius:0}}>{l}</button>)}
</div>}

{!isMob&&<div style={{height:48,flexShrink:0}}/>}

<Dots c={1} t={4}/>
<div style={{textAlign:"center",marginBottom:24}}>
<div style={{fontFamily:serif,fontSize:22,color:C.black,fontWeight:400,lineHeight:1.3}}>{filledCount===0?"Escolha seus perfumes":"Deseja adicionar mais?"}</div>
<div style={{fontSize:12,color:C.g2,marginTop:8,fontWeight:300}}>Selecione de 1 a 3 fragrâncias que você ama</div></div>

<div style={{display:"flex",gap:10,marginBottom:24,justifyContent:"center"}}>
{slots.map((s,i)=>(
<div key={i} onClick={()=>{if(s){removeSlot(i)}else{setActiveSlot(i);setSearchVal("")}}} style={{width:100,height:120,border:activeSlot===i?`2px solid ${C.black}`:`1.5px solid ${s?C.border:C.g5}`,background:s?C.white:C.alt,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",cursor:"pointer",position:"relative",padding:6,transition:"all .2s"}}>
{s?(<>
<div style={{position:"absolute",top:4,right:4,width:18,height:18,borderRadius:9,background:C.black,display:"flex",alignItems:"center",justifyContent:"center"}}><span style={{color:C.white,fontSize:9,fontWeight:700}}>✕</span></div>
<div style={{fontSize:10,color:C.black,fontWeight:500,textAlign:"center",lineHeight:1.3}}>{s.name}</div>
<div style={{fontSize:8,color:C.g2,textAlign:"center",marginTop:2}}>{s.brand}</div>
</>):(<>
<div style={{width:24,height:24,border:`1.5px solid ${C.g4}`,borderRadius:12,display:"flex",alignItems:"center",justifyContent:"center",marginBottom:6}}><span style={{color:C.g3,fontSize:14,lineHeight:1}}>+</span></div>
<div style={{fontSize:9,color:C.g3,letterSpacing:1}}>Perfume {i+1}</div>
</>)}
</div>))}
</div>

<div style={{display:"flex",alignItems:"center",gap:8,marginBottom:20,justifyContent:"center"}}>
<div style={{display:"flex",gap:3}}>{[0,1,2].map(i=><div key={i} style={{width:24,height:3,borderRadius:2,background:i<filledCount?C.black:C.g5,transition:"all .3s"}}/>)}</div>
<span style={{fontSize:10,color:filledCount>=3?C.black:C.g2,fontWeight:filledCount>=3?600:400}}>
{filledCount===0?"Selecione seus perfumes":filledCount===1?"Bom começo!":filledCount===2?"Quase lá!":"Excelente! Precisão máxima"}</span>
</div>

{activeSlot>=0&&(
<div style={{animation:"fadeUp .25s ease",marginBottom:16}}>
<input
  ref={searchInputRef}
  type="text"
  autoComplete="off"
  autoCorrect="off"
  autoCapitalize="off"
  spellCheck={false}
  enterKeyHint="search"
  placeholder="Buscar perfume ou marca..."
  value={searchVal}
  onChange={(e)=>setSearchVal(e.target.value)}
  style={{...inp,borderBottom:`1.5px solid ${C.black}`,fontSize:14,padding:"12px 0"}}
/>
{searchVal.length>=2&&filtered.length===0&&<div style={{textAlign:"center",padding:20,color:C.g3,fontSize:12}}>Nenhum resultado para "{searchVal}"</div>}
<div style={{maxHeight:260,overflowY:"auto"}}>
{filtered.map(p=>(
<div key={p.id} onClick={()=>selectPerfume(p)} style={{display:"flex",alignItems:"center",gap:12,padding:"12px 0",borderBottom:`0.5px solid ${C.g5}`,cursor:"pointer"}}>
<div style={{width:40,height:40,background:C.alt,border:`1px solid ${C.g5}`,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
<span style={{fontFamily:serif,fontSize:16,color:C.g3}}>{p.name[0]}</span></div>
<div><div style={{fontSize:13,color:C.black}}>{p.name}</div><div style={{fontSize:10,color:C.g2,fontWeight:300}}>{p.brand}</div></div>
</div>))}
</div>
{searchVal.length<2&&<div style={{textAlign:"center",fontSize:10,color:C.g4,marginTop:12}}>Digite para buscar</div>}
</div>)}

{filledCount>0&&activeSlot<0&&(
<div style={{borderTop:`0.5px solid ${C.border}`,paddingTop:16,marginBottom:16,animation:"fadeUp .3s ease"}}>
<div style={{fontSize:10,letterSpacing:2,color:C.g2,textTransform:"uppercase",marginBottom:12}}>Notas dos seus perfumes</div>
{["top","mid","base"].map(tier=>{
const names={top:"Topo 🌿",mid:"Coração ❤️",base:"Base 🪵"};
const allN=[...new Set(slots.filter(Boolean).flatMap(s=>(s.notes&&s.notes[tier])||[]))];
if(!allN.length)return null;
return<div key={tier} style={{marginBottom:10}}>
<div style={{fontSize:9,color:C.g3,letterSpacing:1.5,textTransform:"uppercase",marginBottom:6}}>{names[tier]}</div>
<div style={{display:"flex",gap:5,flexWrap:"wrap"}}>{allN.map((n,i)=><span key={i} style={{fontSize:10,color:C.g1,background:C.alt,border:`0.5px solid ${C.g5}`,padding:"4px 10px",borderRadius:12,fontWeight:300}}>{n}</span>)}</div>
</div>})}
</div>)}

{filledCount>=1&&activeSlot<0&&<button onClick={()=>go("analyzing")} style={{...btnP,marginTop:8}}>Descobrir meu perfil</button>}
{filledCount>=1&&filledCount<3&&activeSlot<0&&<div style={{textAlign:"center",fontSize:10,color:C.g3,marginTop:8}}>{filledCount===1?"Adicione mais para maior precisão":"Mais um para precisão máxima!"}</div>}
</div>)}

{/* ═══ ANALYZING ═══ */}
{screen==="analyzing"&&(
<div style={{display:"flex",flexDirection:"column",justifyContent:"center",alignItems:"center",textAlign:"center",minHeight:"100%"}}>
<div style={{position:"relative",width:130,height:130,marginBottom:44}}>
{[0,1,2,3].map(i=><div key={i} style={{position:"absolute",inset:i*14,border:`0.5px solid rgba(26,26,26,${.15-i*.03})`,animation:`${i%2===0?"spin":"spinR"} ${6+i*2}s linear infinite`}}/>)}
<div style={{position:"absolute",inset:46,background:"rgba(26,26,26,0.04)",display:"flex",alignItems:"center",justifyContent:"center"}}><span style={{fontFamily:serif,fontSize:20,color:C.black}}>S</span></div>
</div>
{["Analisando suas escolhas","Identificando acordes","Mapeando perfil olfativo","Encontrando seu SHI"].map((m,i)=><div key={i} style={{fontSize:12,fontWeight:300,color:i<=step?C.g1:C.g5,marginBottom:8,transition:"color .4s",letterSpacing:.5}}>{m}{i===step&&<span style={{animation:"pulse 1s infinite"}}> …</span>}</div>)}
<div style={{display:"flex",gap:3,marginTop:28}}>{[0,1,2,3].map(i=><div key={i} style={{width:24,height:1.5,background:i<=step?C.black:C.g5,transition:"background .4s"}}/>)}</div>
</div>)}

{/* ═══ RESULT ═══ */}
{screen==="result"&&results.length>0&&(
<div>
<Dots c={2} t={4}/>
<div style={{animation:"fadeUp .6s ease"}}>
<div style={{textAlign:"center",fontSize:10,letterSpacing:3,color:C.g2,textTransform:"uppercase",marginBottom:20}}>Seu perfil olfativo</div>
<div style={{border:`1px solid ${C.border}`,padding:"36px 20px",textAlign:"center",position:"relative",marginBottom:20,background:C.white}}>
<div style={{position:"absolute",top:-8,left:"50%",transform:"translateX(-50%)",background:C.bg,padding:"0 10px",fontSize:9,letterSpacing:3,color:C.g3}}>RESULTADO PRINCIPAL</div>
<div style={{fontFamily:serif,fontSize:28,color:C.black,fontWeight:400,letterSpacing:2,marginBottom:10,lineHeight:1.2}}>{results[0].name}</div>
<div style={{fontSize:11,color:C.g2,letterSpacing:1.5,marginBottom:24,fontWeight:300}}>{results[0].desc}</div>
<Divider/>
<div style={{marginTop:24}}>
<div style={{fontSize:9,letterSpacing:3,color:C.g3,textTransform:"uppercase",marginBottom:6}}>Seu SHI</div>
<div style={{fontFamily:serif,fontSize:34,color:C.black,fontWeight:400,letterSpacing:3}}>{results[0].code}</div>
<div style={{fontSize:10,color:C.g2,marginTop:6}}>{Math.round(results[0].score*100)}% de afinidade</div>
</div></div>
<div style={{padding:"16px 0",borderTop:`.5px solid ${C.g5}`,borderBottom:`.5px solid ${C.g5}`,marginBottom:20}}>
<div style={{fontSize:13,color:C.g1,lineHeight:1.8,fontWeight:300}}>{results[0].detail}</div></div>
{results.length>1&&<div style={{marginBottom:20}}>
<div style={{fontSize:10,letterSpacing:2,color:C.g3,textTransform:"uppercase",marginBottom:12}}>Também combina com você</div>
{results.slice(1).map((r,i)=><div key={i} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"14px 16px",border:`.5px solid ${C.g5}`,background:C.white,marginBottom:6}}>
<div><div style={{fontSize:13,fontWeight:500}}>{r.code}</div><div style={{fontSize:11,color:C.g2,fontWeight:300,marginTop:2}}>{r.name}</div></div>
<div style={{fontSize:11,color:C.g3}}>{Math.round(r.score*100)}%</div></div>)}</div>}
<div style={{textAlign:"center",marginBottom:20}}>
<div style={{fontSize:10,color:C.g3,letterSpacing:2,textTransform:"uppercase",marginBottom:10}}>Seus perfumes</div>
<div style={{display:"flex",gap:6,justifyContent:"center",flexWrap:"wrap"}}>{slots.filter(Boolean).map(s=><span key={s.id} style={{fontSize:10,color:C.g1,padding:"5px 12px",border:`.5px solid ${C.g5}`,fontWeight:300}}>{s.name}</span>)}</div></div>
<button onClick={()=>go("passport")} style={btnP}>Passaporte Olfativo</button>
<button onClick={()=>{setSlots([null,null,null]);setSearchVal("");setEvtPass("");go("welcome")}} style={{...btnS,marginTop:8}}>Início</button>
</div></div>)}

{/* ═══ PASSPORT ═══ */}
{screen==="passport"&&results.length>0&&(
<div>
<Dots c={3} t={4}/>
<div style={{textAlign:"center",animation:"scaleIn .5s ease"}}>
<div style={{border:`1px solid ${C.border}`,padding:"40px 20px 32px",position:"relative",background:C.white}}>
{[{top:0,left:0},{top:0,right:0},{bottom:0,left:0},{bottom:0,right:0}].map((pos,i)=><div key={i} style={{position:"absolute",...pos,width:14,height:14,borderTop:pos.top===0?`1.5px solid ${C.g3}`:"none",borderBottom:pos.bottom===0?`1.5px solid ${C.g3}`:"none",borderLeft:pos.left===0?`1.5px solid ${C.g3}`:"none",borderRight:pos.right===0?`1.5px solid ${C.g3}`:"none"}}/>)}
<div style={{fontSize:9,letterSpacing:4,color:C.g3,textTransform:"uppercase",marginBottom:6}}>Passaporte Olfativo</div>
<Logo/>
<div style={{width:30,height:.5,background:C.g4,margin:"20px auto"}}/>
<div style={{fontSize:11,letterSpacing:2,color:C.g2,textTransform:"uppercase",marginBottom:14}}>{formName||"Convidada"}</div>
<div style={{fontFamily:serif,fontSize:24,color:C.black,fontWeight:400,letterSpacing:1,marginBottom:6}}>{results[0].name}</div>
<div style={{fontSize:11,color:C.g2,letterSpacing:1,fontWeight:300,marginBottom:24}}>{results[0].desc}</div>
<div style={{display:"inline-block",border:`1px solid ${C.border}`,padding:"14px 28px"}}>
<div style={{fontSize:9,letterSpacing:3,color:C.g3,textTransform:"uppercase",marginBottom:4}}>Sua fragrância</div>
<div style={{fontFamily:serif,fontSize:22,color:C.black,fontWeight:400,letterSpacing:2}}>{results[0].code}</div></div>
<div style={{marginTop:20,display:"flex",gap:5,justifyContent:"center",flexWrap:"wrap"}}>{slots.filter(Boolean).map(s=><span key={s.id} style={{fontSize:9,color:C.g2,padding:"3px 8px",border:`.5px solid ${C.g5}`,fontWeight:300}}>{s.name}</span>)}</div>
<div style={{marginTop:20,fontSize:9,color:C.g4,letterSpacing:2}}>SINGULAR • HEDÔNICO • INESQUECÍVEL</div>
<div style={{fontSize:9,color:C.g5,marginTop:6}}>Casamento Ana & Lucas • 25/08/2026</div>
</div>
<div style={{marginTop:20,display:"flex",gap:8}}>
<button style={{...btnS,flex:1,fontSize:10,letterSpacing:1.5}}>Compartilhar</button>
<button onClick={()=>{setSlots([null,null,null]);setSearchVal("");setEvtPass("");go("welcome")}} style={{...btnS,flex:1,fontSize:10,letterSpacing:1.5}}>Início</button>
</div></div></div>)}

</div></div></div>
{!isMob&&<div style={{color:C.g4,fontSize:9,marginTop:12,textAlign:"center",letterSpacing:1}}>SHI AROMA LAB • Protótipo • Senha: ANA2508</div>}
</div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
